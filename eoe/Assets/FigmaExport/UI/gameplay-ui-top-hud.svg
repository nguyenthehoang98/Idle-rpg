<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" viewBox="0 0 1080 320">
  <title>Idle Circuit Gameplay Top HUD — Portrait</title>
  <desc>Reusable editable top HUD for the 1080x2160 portrait gameplay screen.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172238"/>
      <stop offset="1" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <style>
      .title{fill:#F8FAFC;font-family:Arial,sans-serif;font-size:34px;font-weight:bold;letter-spacing:2px}
      .heading{fill:#F8FAFC;font-family:Arial,sans-serif;font-size:28px;font-weight:bold;letter-spacing:1px}
      .body{fill:#A8B5C7;font-family:Arial,sans-serif;font-size:21px;letter-spacing:1px}
      .small{fill:#A8B5C7;font-family:Arial,sans-serif;font-size:17px;letter-spacing:1px}
      .mono{fill:#5EEAD4;font-family:Arial,sans-serif;font-size:20px;font-weight:bold;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1080" height="320" fill="#07111F"/>
  <rect x="24" y="24" width="1032" height="272" rx="30" fill="url(#panel)" stroke="#2B4969" stroke-width="3"/>
  <rect x="24" y="24" width="8" height="272" rx="4" fill="url(#teal)"/>

  <!-- Pause control -->
  <g id="pause-control">
    <circle cx="94" cy="112" r="42" fill="#243552" stroke="#5EEAD4" stroke-width="3"/>
    <rect x="80" y="95" width="9" height="34" rx="4" fill="#F8FAFC"/>
    <rect x="99" y="95" width="9" height="34" rx="4" fill="#F8FAFC"/>
    <text class="small" x="94" y="177" text-anchor="middle">PAUSE</text>
  </g>

  <!-- Run identity -->
  <g id="run-identity">
    <text class="title" x="162" y="105">IDLE // CIRCUIT</text>
    <text class="small" x="162" y="144">RUN 01  ·  AUTO COMBAT</text>
  </g>

  <!-- Wave badge -->
  <g id="wave-badge">
    <rect x="646" y="54" width="180" height="98" rx="22" fill="#0D1B2C" stroke="#5EEAD4" stroke-width="3"/>
    <text class="small" x="736" y="90" text-anchor="middle">WAVE</text>
    <text class="heading" x="736" y="131" text-anchor="middle">01</text>
  </g>

  <!-- Level and speed -->
  <g id="level-speed">
    <text class="mono" x="980" y="80" text-anchor="end">x1.0</text>
    <text class="small" x="980" y="116" text-anchor="end">LEVEL 01</text>
    <text class="small" x="980" y="145" text-anchor="end">AUTO</text>
  </g>

  <!-- Wave progress -->
  <g id="wave-progress">
    <rect x="162" y="214" width="818" height="14" rx="7" fill="#243552"/>
    <rect x="162" y="214" width="310" height="14" rx="7" fill="url(#teal)"/>
    <text class="small" x="162" y="266">NEXT WAVE</text>
    <text class="small" x="980" y="266" text-anchor="end">38%</text>
  </g>
</svg>
