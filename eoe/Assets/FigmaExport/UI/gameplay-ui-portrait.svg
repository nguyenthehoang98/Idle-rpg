<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2160" viewBox="0 0 1080 2160">
  <title>Idle Circuit Gameplay UI — Portrait 1080x2160</title>
  <desc>Original editable portrait gameplay HUD concept with wave status, combat arena, and energy circuit controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172238"/>
      <stop offset="1" stop-color="#111C30"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#1D3552" stroke-width="2" opacity=".42"/>
      <circle cx="0" cy="0" r="3" fill="#2B4969" opacity=".55"/>
    </pattern>
    <style>
      .ink{stroke:#07111F;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .line{fill:none;stroke-linejoin:round;stroke-linecap:round}
      .title{fill:#F8FAFC;font-family:Arial,sans-serif;font-size:34px;font-weight:bold;letter-spacing:2px}
      .heading{fill:#F8FAFC;font-family:Arial,sans-serif;font-size:28px;font-weight:bold;letter-spacing:1px}
      .body{fill:#A8B5C7;font-family:Arial,sans-serif;font-size:21px;letter-spacing:1px}
      .small{fill:#A8B5C7;font-family:Arial,sans-serif;font-size:17px;letter-spacing:1px}
      .mono{fill:#5EEAD4;font-family:Arial,sans-serif;font-size:20px;font-weight:bold;letter-spacing:2px}
    </style>
  </defs>

  <!-- Portrait device artboard -->
  <rect width="1080" height="2160" fill="url(#bg)"/>
  <rect x="36" y="36" width="1008" height="2088" rx="42" fill="none" stroke="#203653" stroke-width="3"/>

  <!-- Atmospheric arena behind the HUD -->
  <rect x="48" y="316" width="984" height="1372" rx="34" fill="#0A1525" stroke="#1B334E" stroke-width="3"/>
  <rect x="48" y="316" width="984" height="1372" rx="34" fill="url(#grid)" opacity=".58"/>
  <path d="M82 466H998M82 1538H998" stroke="#2B4969" stroke-width="2" opacity=".45"/>
  <text class="small" x="84" y="374">COMBAT ZONE / SECTOR 01</text>
  <text class="small" x="996" y="374" text-anchor="end">AUTO TARGETING</text>

  <!-- Top bar -->
  <g id="top-hud">
    <rect x="48" y="64" width="984" height="204" rx="28" fill="url(#panel)" stroke="#2B4969" stroke-width="3"/>
    <rect x="48" y="64" width="8" height="204" rx="4" fill="url(#tealGlow)"/>

    <!-- Pause visual control -->
    <circle cx="112" cy="136" r="42" fill="#243552" stroke="#5EEAD4" stroke-width="3"/>
    <rect x="98" y="119" width="9" height="34" rx="4" fill="#F8FAFC"/>
    <rect x="117" y="119" width="9" height="34" rx="4" fill="#F8FAFC"/>

    <text class="title" x="180" y="124">IDLE // CIRCUIT</text>
    <text class="small" x="180" y="163">RUN 01  ·  AUTO COMBAT</text>

    <!-- Wave badge -->
    <rect x="662" y="88" width="174" height="88" rx="20" fill="#0D1B2C" stroke="#5EEAD4" stroke-width="3"/>
    <text class="small" x="749" y="120" text-anchor="middle">WAVE</text>
    <text class="heading" x="749" y="157" text-anchor="middle">01</text>

    <!-- Speed/status -->
    <text class="mono" x="938" y="117" text-anchor="end">x1.0</text>
    <text class="small" x="938" y="151" text-anchor="end">LEVEL 01</text>
    <rect x="180" y="203" width="758" height="12" rx="6" fill="#243552"/>
    <rect x="180" y="203" width="286" height="12" rx="6" fill="url(#tealGlow)" filter="url(#smallGlow)"/>
    <text class="small" x="180" y="248">NEXT WAVE</text>
    <text class="small" x="938" y="248" text-anchor="end">38%</text>
  </g>

  <!-- Arena indicators and original placeholder combat shapes -->
  <g id="arena-ui">
    <rect x="84" y="414" width="300" height="66" rx="18" fill="#111F34" stroke="#243F5C" stroke-width="2"/>
    <circle cx="119" cy="447" r="12" fill="#F97316" filter="url(#smallGlow)"/>
    <text class="body" x="148" y="455">ENEMIES  04</text>

    <rect x="696" y="414" width="300" height="66" rx="18" fill="#111F34" stroke="#243F5C" stroke-width="2"/>
    <circle cx="731" cy="447" r="12" fill="#5EEAD4" filter="url(#smallGlow)"/>
    <text class="body" x="760" y="455">FORMATION  A</text>

    <!-- Enemy marker -->
    <g transform="translate(810 696)">
      <circle r="70" fill="#F97316" opacity=".10" filter="url(#softGlow)"/>
      <path class="ink" fill="#F97316" d="M0-48 42-14 27 38 0 56-27 38-42-14z"/>
      <path class="ink" fill="#7C2D12" d="M-23-10 0-29 23-10 17 19 0 32-17 19z"/>
      <circle cx="-8" cy="-2" r="5" fill="#FDE047"/>
      <circle cx="8" cy="-2" r="5" fill="#FDE047"/>
      <rect x="-52" y="73" width="104" height="10" rx="5" fill="#243552"/>
      <rect x="-52" y="73" width="66" height="10" rx="5" fill="#F97316"/>
      <text class="small" x="0" y="112" text-anchor="middle">TARGET LOCK</text>
    </g>

    <!-- Projectile trail -->
    <path d="M398 1042C498 1014 598 982 726 904" class="line" stroke="#A3E635" stroke-width="8" opacity=".18"/>
    <path d="M426 1034C516 1006 609 970 714 910" class="line" stroke="#A3E635" stroke-width="4" opacity=".72"/>
    <path d="M690 894 734 902 704 933z" fill="#A3E635" filter="url(#smallGlow)"/>

    <!-- Hero placeholder / selection focus -->
    <g transform="translate(338 1112)">
      <circle r="102" fill="#5EEAD4" opacity=".08" filter="url(#softGlow)"/>
      <circle r="78" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-dasharray="12 14" opacity=".7"/>
      <path class="ink" fill="url(#violetGlow)" d="M-64-32 0-80 64-32 43-8H-43z"/>
      <path class="ink" fill="#155E75" d="M-58 20C-76 46-70 76-47 83L0 66 47 83C70 76 76 46 58 20L34 0H-34z"/>
      <path class="ink" fill="#7C3AED" d="M-35-25C-49-8-47 27-30 42L0 55 30 42C47 27 49-8 35-25z"/>
      <path class="ink" fill="#F8FAFC" d="M-32-43C-29-78 29-78 32-43L21-17H-21z"/>
      <path d="M-19-40H19" class="line" stroke="#5EEAD4" stroke-width="7"/>
      <circle cx="-10" cy="-34" r="4" fill="#5EEAD4"/>
      <circle cx="10" cy="-34" r="4" fill="#5EEAD4"/>
      <rect x="-76" y="112" width="152" height="13" rx="6" fill="#243552"/>
      <rect x="-76" y="112" width="119" height="13" rx="6" fill="#5EEAD4"/>
      <text class="small" x="0" y="159" text-anchor="middle">NEON VANGUARD</text>
      <text class="mono" x="0" y="188" text-anchor="middle">HP  820 / 1000</text>
    </g>

    <!-- Orbit weapon visual -->
    <g transform="translate(486 1060) rotate(-20)">
      <circle r="55" fill="none" stroke="#5EEAD4" stroke-width="8" opacity=".18" filter="url(#smallGlow)"/>
      <circle r="42" fill="none" stroke="#F97316" stroke-width="8"/>
      <circle r="15" fill="#FDE047" stroke="#07111F" stroke-width="5"/>
      <path d="M-53-53 53 53M53-53-53 53" class="line" stroke="#F8FAFC" stroke-width="4"/>
    </g>
  </g>

  <!-- Bottom energy circuit panel -->
  <g id="energy-circuit">
    <rect x="48" y="1722" width="984" height="386" rx="32" fill="url(#panel)" stroke="#2B4969" stroke-width="3"/>
    <rect x="48" y="1722" width="8" height="386" rx="4" fill="url(#tealGlow)"/>
    <text class="heading" x="88" y="1788">ENERGY CIRCUIT</text>
    <text class="body" x="88" y="1825">PULSE  ·  3 STACKS TO OVERDRIVE</text>
    <text class="mono" x="992" y="1800" text-anchor="end">SYNC 82%</text>
    <path d="M88 1852H992" stroke="#31506E" stroke-width="2"/>

    <!-- Slot 01 -->
    <g transform="translate(82 1890)">
      <rect width="106" height="146" rx="18" fill="#3B315C" stroke="#A78BFA" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">01</text>
      <path class="ink" fill="#A78BFA" d="M53 54 80 72 70 105 53 115 36 105 26 72z"/>
      <text class="small" x="53" y="133" text-anchor="middle">GEN</text>
    </g>

    <!-- Hero slots -->
    <g transform="translate(206 1890)">
      <rect width="106" height="146" rx="18" fill="#143D4B" stroke="#5EEAD4" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">02</text>
      <circle cx="53" cy="78" r="25" fill="#7C3AED" stroke="#07111F" stroke-width="5"/>
      <circle cx="45" cy="75" r="4" fill="#5EEAD4"/><circle cx="61" cy="75" r="4" fill="#5EEAD4"/>
      <text class="small" x="53" y="133" text-anchor="middle">H 101</text>
    </g>
    <g transform="translate(330 1890)">
      <rect width="106" height="146" rx="18" fill="#243552" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">03</text>
      <circle cx="53" cy="78" r="25" fill="#155E75" stroke="#07111F" stroke-width="5"/>
      <path d="M40 78H66" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
      <text class="small" x="53" y="133" text-anchor="middle">H 102</text>
    </g>
    <g transform="translate(454 1890)">
      <rect width="106" height="146" rx="18" fill="#243552" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">04</text>
      <circle cx="53" cy="78" r="25" fill="#0E7490" stroke="#07111F" stroke-width="5"/>
      <path d="M42 88 53 65 64 88" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linejoin="round"/>
      <text class="small" x="53" y="133" text-anchor="middle">H 103</text>
    </g>
    <g transform="translate(578 1890)">
      <rect width="106" height="146" rx="18" fill="#243552" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">05</text>
      <circle cx="53" cy="78" r="25" fill="#4C1D95" stroke="#07111F" stroke-width="5"/>
      <path d="M41 78H65M53 66V90" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/>
      <text class="small" x="53" y="133" text-anchor="middle">H 104</text>
    </g>
    <g transform="translate(702 1890)">
      <rect width="106" height="146" rx="18" fill="#17263D" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">06</text>
      <text class="heading" x="53" y="88" text-anchor="middle" fill="#526B86">·</text>
      <text class="small" x="53" y="133" text-anchor="middle">EMPTY</text>
    </g>
    <g transform="translate(826 1890)">
      <rect width="106" height="146" rx="18" fill="#17263D" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="53" y="34" text-anchor="middle">07</text>
      <text class="heading" x="53" y="88" text-anchor="middle" fill="#526B86">·</text>
      <text class="small" x="53" y="133" text-anchor="middle">EMPTY</text>
    </g>
    <g transform="translate(950 1890)">
      <rect width="48" height="146" rx="18" fill="#17263D" stroke="#35516D" stroke-width="3"/>
      <text class="small" x="24" y="34" text-anchor="middle">08</text>
      <text class="heading" x="24" y="88" text-anchor="middle" fill="#526B86">·</text>
    </g>
  </g>

  <text class="small" x="540" y="2150" text-anchor="middle">PORTRAIT UI CONCEPT  ·  1080 × 2160  ·  EDITABLE SVG</text>
</svg>
