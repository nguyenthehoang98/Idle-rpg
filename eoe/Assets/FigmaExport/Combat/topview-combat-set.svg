<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="840" viewBox="0 0 1024 840">
  <title>Top View RPG Combat Asset Set</title>
  <desc>Flat vector weapons, projectiles and visual effects for the top-view RPG prototype.</desc>
  <defs>
    <style>
      .card{fill:#172238;stroke:#334155;stroke-width:2}
      .ink{stroke:#07111F;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#07111F;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
      .label{fill:#F8FAFC;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;text-anchor:middle}
      .sub{fill:#A8B5C7;font-family:Arial,sans-serif;font-size:11px;text-anchor:middle}
      .glow{fill:none;stroke:#5EEAD4;stroke-width:4;stroke-linecap:round;opacity:.8}
    </style>
  </defs>

  <!-- Preview cards. Remove cards and labels when exporting individual game assets. -->
  <g id="PreviewCards">
    <rect class="card" x="12" y="12" width="236" height="252" rx="16"/><rect class="card" x="268" y="12" width="236" height="252" rx="16"/><rect class="card" x="524" y="12" width="236" height="252" rx="16"/><rect class="card" x="780" y="12" width="232" height="252" rx="16"/>
    <rect class="card" x="12" y="292" width="236" height="252" rx="16"/><rect class="card" x="268" y="292" width="236" height="252" rx="16"/><rect class="card" x="524" y="292" width="236" height="252" rx="16"/><rect class="card" x="780" y="292" width="232" height="252" rx="16"/>
    <rect class="card" x="12" y="572" width="236" height="252" rx="16"/><rect class="card" x="268" y="572" width="236" height="252" rx="16"/><rect class="card" x="524" y="572" width="236" height="252" rx="16"/><rect class="card" x="780" y="572" width="232" height="252" rx="16"/>
  </g>

  <!-- Weapons -->
  <g id="PlasmaSword" transform="translate(130 130)">
    <path class="ink" fill="#334155" d="M-11 52h22v31h-22z"/><path class="ink" fill="#5EEAD4" d="M-10 50 0-78l10 128z"/><path class="thin" fill="#F8FAFC" d="M0-58 3 35-3 35z"/><path class="ink" fill="#F97316" d="M-31 49h62v14h-62z"/><path class="thin" fill="none" d="M-20 70h40"/><text class="label" y="102">PLASMA SWORD</text><text class="sub" y="120">weapon / melee</text>
  </g>
  <g id="ArcBow" transform="translate(386 130)">
    <path class="ink" fill="none" d="M-42-68c-34 45-34 91 0 136"/><path class="thin" fill="none" d="M-42-68 39 68"/><path class="ink" fill="#F97316" d="M-42 0h82l-13-8 13-8h-82l-13 8z"/><path class="thin" fill="#F8FAFC" d="M-34-5h67v10h-67z"/><path class="thin" fill="#5EEAD4" d="M40-13 63 0 40 13z"/><text class="label" y="102">ARC BOW</text><text class="sub" y="120">weapon / ranged</text>
  </g>
  <g id="PulseStaff" transform="translate(642 130)">
    <path class="ink" fill="#7C3AED" d="M-8-72h16v148H-8z"/><circle class="ink" cx="0" cy="-73" r="25" fill="#5EEAD4"/><circle class="thin" cx="0" cy="-73" r="10" fill="#F8FAFC"/><path class="thin" fill="none" d="M-24-47h48M-18-39h36"/><path class="thin" fill="none" d="M-17 53h34"/><text class="label" y="102">PULSE STAFF</text><text class="sub" y="120">weapon / magic</text>
  </g>
  <g id="VoidDagger" transform="translate(896 130)">
    <path class="ink" fill="#111827" d="M0-82 20 16 0 52-20 16z"/><path class="thin" fill="#A78BFA" d="M0-61 8 13 0 29-8 13z"/><path class="ink" fill="#F97316" d="M-32 43h64v15h-64z"/><path class="thin" fill="none" d="M-18 65h36"/><text class="label" y="102">VOID DAGGER</text><text class="sub" y="120">weapon / quick hit</text>
  </g>

  <!-- Projectiles -->
  <g id="EnergyBolt" transform="translate(130 410)">
    <path class="glow" d="M-64 0h128"/><path class="ink" fill="#5EEAD4" d="M-55 0 0-17 55 0 0 17z"/><path class="thin" fill="#F8FAFC" d="M-25 0 0-7 25 0 0 7z"/><path class="glow" d="M-78 0h-18M78 0h18"/><text class="label" y="102">ENERGY BOLT</text><text class="sub" y="120">projectile / straight</text>
  </g>
  <g id="ArrowProjectile" transform="translate(386 410)">
    <path class="ink" fill="#F8FAFC" d="M-77-4h126v8H-77z"/><path class="ink" fill="#F97316" d="M49-17 77 0 49 17z"/><path class="thin" fill="#5EEAD4" d="M-77-4-94-17l8 17-8 17 17-13z"/><path class="glow" d="M-53-12h28M-53 12h28"/><text class="label" y="102">ARC ARROW</text><text class="sub" y="120">projectile / pierce</text>
  </g>
  <g id="PlasmaOrb" transform="translate(642 410)">
    <circle class="glow" cx="0" cy="0" r="48"/><circle class="ink" cx="0" cy="0" r="30" fill="#7C3AED"/><circle class="thin" cx="0" cy="0" r="14" fill="#F8FAFC"/><path class="thin" fill="none" d="M-43-20c18-19 40-27 62-26M-47 17c18 20 39 28 65 25"/><text class="label" y="102">PLASMA ORB</text><text class="sub" y="120">projectile / magic</text>
  </g>
  <g id="SkullRocket" transform="translate(896 410)">
    <path class="glow" d="M-72 0h-24M72 0h24"/><path class="ink" fill="#E2E8F0" d="M-30 0c0-25 13-42 30-42s30 17 30 42c0 18-10 28-30 28S-30 18-30 0z"/><path class="thin" fill="#7C3AED" d="M-12 12h24v18h-24z"/><circle cx="-11" cy="0" r="6" fill="#07111F"/><circle cx="11" cy="0" r="6" fill="#07111F"/><path class="ink" fill="#F97316" d="M-18-38 0-62l18 24z"/><text class="label" y="102">SKULL ROCKET</text><text class="sub" y="120">projectile / tracking</text>
  </g>

  <!-- VFX -->
  <g id="SlashArc" transform="translate(130 690)">
    <path class="ink" fill="none" d="M-76 42C-48-42 37-66 78-7"/><path class="thin" fill="none" stroke="#F8FAFC" d="M-62 35C-35-27 28-46 61-5"/><path class="glow" d="M-85 54C-50-49 46-77 89-9"/><circle cx="-75" cy="50" r="7" fill="#F97316"/><circle cx="75" cy="-8" r="7" fill="#5EEAD4"/><text class="label" y="102">SLASH ARC</text><text class="sub" y="120">vfx / melee hit</text>
  </g>
  <g id="HitSpark" transform="translate(386 690)">
    <path class="ink" fill="#F8FAFC" d="M0-78 10-18 55-54 28-8 82 0 28 9 55 54 10 18 0 78-10 18-55 54-28 9-82 0-28-8-55-54-10-18z"/><circle class="thin" cx="0" cy="0" r="22" fill="#F97316"/><circle cx="0" cy="0" r="8" fill="#F8FAFC"/><text class="label" y="102">HIT SPARK</text><text class="sub" y="120">vfx / impact</text>
  </g>
  <g id="ExplosionBurst" transform="translate(642 690)">
    <path class="ink" fill="#F97316" d="M0-82 17-37 58-58 38-17 82 0 38 17 58 58 17 38 0 82-17 38-58 58-38 17-82 0-38-17-58-58-17-37z"/><circle class="thin" cx="0" cy="0" r="31" fill="#FDE047"/><circle cx="0" cy="0" r="13" fill="#F8FAFC"/><path class="glow" d="M-65-65 65 65M65-65-65 65"/><text class="label" y="102">EXPLOSION BURST</text><text class="sub" y="120">vfx / area damage</text>
  </g>
  <g id="MagicRing" transform="translate(896 690)">
    <circle class="glow" cx="0" cy="0" r="66"/><circle class="ink" cx="0" cy="0" r="48" fill="none" stroke="#7C3AED"/><circle class="thin" cx="0" cy="0" r="26" fill="none" stroke="#F8FAFC"/><path class="thin" fill="none" d="M0-66v18M0 48v18M-66 0h18M48 0h18"/><circle cx="0" cy="0" r="8" fill="#5EEAD4"/><text class="label" y="102">MAGIC RING</text><text class="sub" y="120">vfx / spell cast</text>
  </g>
</svg>
