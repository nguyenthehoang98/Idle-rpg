<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <title>Top View RPG Character and Monster Set</title>
  <desc>Ten flat vector top-view units for Figma preview: four heroes and six monsters.</desc>
  <defs>
