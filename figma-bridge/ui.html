<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; font: 12px Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #111827; color: #f8fafc; }
    h1 { margin: 0 0 14px; font-size: 16px; }
    label { display: block; margin: 10px 0 5px; color: #a8b5c7; }
    input { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #334155; border-radius: 6px; background: #0b1220; color: #f8fafc; }
    button { margin-top: 14px; padding: 8px 12px; border: 0; border-radius: 6px; background: #5eead4; color: #062f39; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    #status { min-height: 34px; margin-top: 14px; padding: 8px; border-radius: 6px; background: #172238; white-space: pre-wrap; word-break: break-word; }
    .warning { margin-top: 12px; color: #fbbf24; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Idle RPG UI Bridge</h1>
  <label for="url">Local bridge URL</label>
  <input id="url" value="http://localhost:38471">
  <label for="token">Local token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Paste token from bridge terminal">
  <button id="connect">Connect</button>
  <div id="status">Disconnected. No command will run until you connect.</div>
  <div class="warning">Draft-only bridge. It cannot delete nodes or execute arbitrary code. Review every generated page before exporting.</div>
  <script>
    const urlInput = document.getElementById('url');
    const tokenInput = document.getElementById('token');
    const connectButton = document.getElementById('connect');
    const status = document.getElementById('status');
    let connected = false;
    let connecting = false;
    let polling = false;
    let reconnectTimer = null;

    function baseUrl() { return urlInput.value.trim().replace(/\/$/, ''); }
    function token() { return tokenInput.value.trim(); }
    function setStatus(message) { status.textContent = message; }
    function headers() { return { 'X-Bridge-Token': token() }; }

    async function getJson(path) {
      const response = await fetch(`${baseUrl()}${path}`, { headers: headers() });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || `HTTP ${response.status}`);
      return body;
    }

    async function postJson(path, payload) {
      const response = await fetch(`${baseUrl()}${path}`, {
        method: 'POST',
        headers: { ...headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error?.message || `HTTP ${response.status}`);
      return body;
    }

    function scheduleReconnect() {
      if (reconnectTimer || !token()) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, 1500);
    }

    async function connect() {
      if (connecting || !token()) return;
      connecting = true;
      connectButton.disabled = true;
      try {
        await getJson('/next?token=' + encodeURIComponent(token()));
        connected = true;
        setStatus('Connected. Waiting for approved commands.');
      } catch (error) {
        connected = false;
        setStatus(`Waiting for bridge: ${error.message}`);
        scheduleReconnect();
      } finally {
        connecting = false;
        connectButton.disabled = false;
      }
    }

    async function poll() {
      if (!connected || polling) return;
      polling = true;
      try {
        const body = await getJson('/next?token=' + encodeURIComponent(token()));
        if (body.command) {
          setStatus(`Executing ${body.command.op} (${body.command.id})`);
          parent.postMessage({ pluginMessage: { type: 'execute-command', command: body.command } }, '*');
        }
      } catch (error) {
        connected = false;
        setStatus(`Bridge reconnecting: ${error.message}`);
        scheduleReconnect();
      } finally {
        polling = false;
      }
    }

    connectButton.addEventListener('click', connect);

    window.onmessage = async (event) => {
      const message = event.data.pluginMessage;
      if (!message || message.type !== 'command-result') return;
      setStatus(JSON.stringify(message.result));
      try {
        await postJson('/event', { id: message.id, result: message.result });
      } catch (error) {
        setStatus(`Result delivery failed: ${error.message}`);
      }
    };

    setInterval(poll, 500);
  </script>
</body>
</html>
