<!doctype html>
<html>
<head>
  <style>
    body { font: 12px Inter, sans-serif; margin: 16px; color: #222; }
    button { width: 100%; margin: 6px 0; padding: 9px; border: 0; border-radius: 6px; background: #18a999; color: white; cursor: pointer; }
    button.secondary { background: #344054; }
    #status { margin-top: 12px; color: #667085; min-height: 32px; }
  </style>
</head>
<body>
  <strong>Idle RPG UI Bridge</strong>
  <button id="pull">Apply AI command</button>
  <button id="export" class="secondary">Export Home to Unity</button>
  <div id="status">Bridge: http://127.0.0.1:8787</div>
  <script>
    const status = document.getElementById('status');
    document.getElementById('pull').onclick = () => parent.postMessage({ pluginMessage: { type: 'pull' } }, '*');
    document.getElementById('export').onclick = () => parent.postMessage({ pluginMessage: { type: 'export-home' } }, '*');
    window.onmessage = (event) => {
      if (event.data.pluginMessage?.type === 'status') {
        status.textContent = event.data.pluginMessage.message;
      }
    };
  </script>
</body>
</html>
